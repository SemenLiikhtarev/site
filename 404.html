<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 — страница не найдена</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07070c;
      --text: #f3f3f8;
      --muted: #9c9cae;
      --gradient: linear-gradient(120deg, #8b6cff 0%, #22d3ee 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", system-ui, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 400px at 20% 10%, rgba(139, 108, 255, 0.28), transparent 65%),
        radial-gradient(520px 380px at 85% 90%, rgba(34, 211, 238, 0.16), transparent 65%);
      filter: blur(10px);
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 520px;
    }

    .code {
      display: block;
      font-family: "Unbounded", system-ui, sans-serif;
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.04em;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 22px 0 0;
      font-family: "Unbounded", system-ui, sans-serif;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 14px 0 30px;
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--gradient);
      color: #07070c;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 34px -14px rgba(139, 108, 255, 0.9);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 44px -14px rgba(34, 211, 238, 0.7);
    }

    .btn:focus-visible {
      outline: 2px solid #22d3ee;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <span class="code">404</span>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там всё на месте.</p>
    <a class="btn" href="/site/">← На главную</a>
  </main>
</body>
</html>
